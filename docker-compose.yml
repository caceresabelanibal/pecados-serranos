services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: pecados_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-pecados_serranos}
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pecados_serranos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicación Web Next.js (Catálogo, Panel Admin, API & Carrito)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pecados_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-pecados_serranos}?schema=public
      NODE_ENV: production
      PORT: 3000
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Falta ADMIN_PASSWORD_HASH en .env (ver README)}
      SESSION_SECRET: ${SESSION_SECRET:?Falta SESSION_SECRET en .env (ver README)}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    security_opt:
      - no-new-privileges:true
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
    driver: local
